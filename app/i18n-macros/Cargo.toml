# t!("text") and tf!("text {name}", ..): the Platform Manager's on-screen
# texts, looked up in the chosen language (crate::i18n). English is the key.
[package]
name = "spm-i18n-macros"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["The SENTIENT Authors"]
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
