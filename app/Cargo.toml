# The SENTIENT Platform Manager on GPUI: one program that is the installer
# (SENTIENT-Setup.exe), the maintenance tool (setup run again) and the
# management app (Start menu). Its own workspace, so the
# engines' workspace stays free of UI dependencies.
[workspace]

[package]
name = "sentient-platform-manager"
version = "0.9.7"
edition = "2021"
license = "Apache-2.0"
authors = ["The SENTIENT Authors"]
publish = false

[features]
# The window. Without it (`--no-default-features`) the same code builds the
# server agent: --job, status, logs, backups and the rest, with no desktop
# libraries at all (crate::remote copies it to servers).
default = ["gui"]
gui = ["dep:gpui-kit", "dep:ksni", "dep:tray-icon", "dep:png", "dep:notify-rust", "dep:alacritty_terminal", "dep:portable-pty"]

[build-dependencies]
winresource = "0.1"

[dependencies]
sha2 = "0.10"   # the pinned code-signing certificate (authenticode.rs)
# Exact pin: GPUI's API changes between releases (see
# docs/GPUI_PLATFORM_MANAGER_PLAN.md, Pinned versions).
gpui-kit = { version = "=0.7.3", optional = true }
sentient-installer-core = { path = "../crates/sentient-installer-core" }
sentient-backup-core = { path = "../crates/sentient-backup-core" }
# The backup engine is async on tokio; jobs run it on a small runtime of their own.
tokio = { version = "1", features = ["rt"] }
futures = "0.3"
anyhow = "1"
# The same hashing SENTIENT verifies (common/src/security/password.rs).
argon2 = { version = "0.5", features = ["std"] }
chrono = "0.4"
sysinfo = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SENTIENT's secrets key check (AES-256-GCM, as dao/src/secrets.rs seals it).
aes-gcm = "0.10"
base64 = "0.22"
# The secrets key beside an encrypted backup, sealed with its passphrase as
# the backup is (sentient-backup-core uses the same age).
age = "0.10"
# SENTIENT's licence REST API (crate::licence); the version the core crates use.
ureq = "2"
# The support file (crate::support).
tar = "0.4"
# The tray icon's pixels (crate::tray).
png = { version = "0.17", optional = true }
# The built-in terminal (crate::terminal): the screen grid and escape
# parser of Alacritty, and a pseudo terminal on Linux and Windows (ConPTY)
# from WezTerm.
alacritty_terminal = { version = "0.26", optional = true }
portable-pty = { version = "0.9", optional = true }

# Database password in Windows Credential Manager (see src/secrets.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
raw-window-handle = "0.6"

# The tray (crate::tray): StatusNotifierItem over D-Bus on Linux (KDE, and
# GNOME with its AppIndicator extension), the notification area on Windows.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", optional = true, default-features = false, features = ["blocking", "async-io"] }
notify-rust = { version = "4", optional = true }

[target.'cfg(windows)'.dependencies.tray-icon]
version = "0.26"
optional = true
default-features = false

# GPUI's Linux platform with the SENTIENT fixes for the see-through menu
# (vendor/gpui-pre-linux/SENTIENT-PATCHES.md).
[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-component = { path = "vendor/gpui-component" }
