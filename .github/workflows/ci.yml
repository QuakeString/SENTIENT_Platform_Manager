name: CI

on:
  push:
    branches: [master, main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller, faster debug builds: CI needs the tests' answer, not debuggers.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests check Windows only (the build machine runs the Linux tests before
        # every push); master pushes run both.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["windows-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --verbose
      - run: cargo test --verbose

  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["windows-latest"]') || fromJSON('["windows-latest", "ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Install GPUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1
      - name: Build and test the GPUI app
        working-directory: app
        run: cargo test --verbose

  # The server agent: the job code without the window (crate::remote copies
  # it to servers). Linux must be static so it runs on any distribution.
  agent:
    name: agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: agent
      - name: Build the static Linux agent
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --locked --no-default-features --target x86_64-unknown-linux-musl
          bin=target/x86_64-unknown-linux-musl/debug/sentient-platform-manager
          ldd "$bin" 2>&1 | tee /dev/stderr | grep -qE 'statically linked|not a dynamic executable'
          "$bin" --job monitor-json
      - name: Build and test the Windows agent
        if: runner.os == 'Windows'
        working-directory: app
        run: |
          cargo build --locked --no-default-features
          cargo test --locked --no-default-features
