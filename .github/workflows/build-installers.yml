name: build-installers

# Builds the Windows setup program (installer/, embedding the Platform
# Manager) and the Linux packages (.deb + AppImage). Run
# manually (Actions -> build-installers -> Run workflow, pick debug/release) or
# on a version tag (debug by default — fast, for iteration; trigger a manual
# release build for a shippable installer). On a version tag both are also
# attached to a GitHub Release (see the release job). Also runs (debug) on a PR
# that edits this file, so a change to the installer build is proven before it
# merges.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile (debug = fast, release = optimized/shippable)"
        type: choice
        options: [debug, release]
        default: debug
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/build-installers.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Caches the third-party dependency builds for src-tauri (tauri, webview
      # bindings, etc.) keyed on Cargo.lock — the bulk of a cold build.
      # Caches the third-party dependency builds (tauri, webview bindings,
      # etc.) for both Tauri apps, keyed on their Cargo.lock files — the bulk
      # of a cold build.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            installer/src-tauri

      # Prebuilt Tauri CLI from npm — downloads the cargo-tauri binary in
      # seconds instead of compiling `cargo install tauri-cli` (~5-8 min).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tauri CLI (prebuilt)
        run: npm install -g @tauri-apps/cli@^2

      - name: Pick the build profile
        shell: bash
        run: |
          if [ "${{ github.event.inputs.profile }}" = "release" ]; then
            echo "Building RELEASE (optimized/shippable)"
            echo "PROFILE=release" >> "$GITHUB_ENV"
            echo "TAURI_FLAGS=" >> "$GITHUB_ENV"
          else
            echo "Building DEBUG (fast iteration)"
            echo "PROFILE=debug" >> "$GITHUB_ENV"
            echo "TAURI_FLAGS=--debug" >> "$GITHUB_ENV"
          fi

      # The Windows installer is our own Tauri setup program (installer/), not
      # the Tauri NSIS bundle: NSIS pixelates its artwork at fractional DPI.
      # bundle.active is false in both configs, so `tauri build` produces just
      # the executables. Each app gets its own working directory because the
      # CLI would otherwise pick whichever tauri.conf.json it finds first.
      - name: Build the Platform Manager
        working-directory: src-tauri
        shell: bash
        run: tauri build $TAURI_FLAGS

      # The setup program embeds the Platform Manager executable at compile
      # time (include_bytes! of payload/SENTIENT Platform Manager.exe).
      - name: Build the setup program
        shell: bash
        run: |
          cp "src-tauri/target/$PROFILE/sentient-manager-app.exe" \
             "installer/src-tauri/payload/SENTIENT Platform Manager.exe"
          cd installer/src-tauri
          tauri build $TAURI_FLAGS
          version=$(node -p "require('./tauri.conf.json').version")
          mkdir -p ../../dist
          cp "target/$PROFILE/sentient-setup.exe" "../../dist/SENTIENT-Platform-Manager-Setup-$version.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          if-no-files-found: error
          path: dist/*.exe

  # The GPUI installer + Platform Manager (app/): one exe. The offline package
  # (PostgreSQL, TimescaleDB, SENTIENT payload) is assembled from it by
  # scripts/package-windows.ps1 where the payload files are.
  gpui-windows:
    name: GPUI setup (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Build
        working-directory: app
        shell: bash
        run: |
          if [ "${{ github.event.inputs.profile }}" = "release" ]; then
            cargo build --release; echo "PROFILE=release" >> "$GITHUB_ENV"
          else
            cargo build; echo "PROFILE=debug" >> "$GITHUB_ENV"
          fi
      - name: Test
        working-directory: app
        run: cargo test
      - name: Stage
        shell: pwsh
        run: |
          $v = (Select-String -Path app\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $exe = "app\target\$env:PROFILE\sentient-platform-manager.exe"
          if ((Get-Item $exe).VersionInfo.FileVersion -ne $v) { throw "FileVersion does not match Cargo.toml $v" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe "dist\SENTIENT-Setup-manager-$v.exe"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gpui-setup-windows
          if-no-files-found: error
          path: dist/*.exe

  linux:
    name: linux packages
    # 22.04 (glibc 2.35) rather than ubuntu-latest so the .deb / AppImage also
    # run on older distros — a binary built on newer glibc won't start there.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux GTK/WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libgtk-3-dev libappindicator3-dev file

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tauri CLI (prebuilt)
        run: npm install -g @tauri-apps/cli@^2

      # The committed tauri.conf.json keeps bundle.active false (Windows ships
      # through installer/) and lists the Windows-only pgtools resources, so
      # Linux overrides both with --config rather than forking the config —
      # the same override packaging/linux/build-ubuntu.sh uses.
      - name: Build packages
        working-directory: src-tauri
        run: |
          OVERRIDE='{"bundle":{"active":true,"resources":[]}}'
          if [ "${{ github.event.inputs.profile }}" = "release" ]; then
            echo "Building RELEASE packages"
            tauri build --bundles deb,appimage --config "$OVERRIDE"
            echo "BUNDLE_DIR=release" >> "$GITHUB_ENV"
          else
            echo "Building DEBUG packages (fast iteration)"
            tauri build --debug --bundles deb,appimage --config "$OVERRIDE"
            echo "BUNDLE_DIR=debug" >> "$GITHUB_ENV"
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          if-no-files-found: error
          path: |
            src-tauri/target/${{ env.BUNDLE_DIR }}/bundle/deb/*.deb
            src-tauri/target/${{ env.BUNDLE_DIR }}/bundle/appimage/*.AppImage

  # On a v* tag, attach both installers to a GitHub Release for that tag so they
  # stay downloadable (Actions artifacts expire after 90 days).
  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One publish per tag at a time, so a tag push and a manual run can't race.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A plain tag push (debug) publishes a pre-release and never replaces files
      # already there. Running this workflow by hand on the tag with
      # profile=release replaces them with optimized builds (same file names) and
      # makes it a full release, marked Latest.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PROFILE: ${{ github.event.inputs.profile }}
        run: |
          mapfile -t files < <(find dist -type f)
          printf 'Attaching %s\n' "${files[@]}"
          exists=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exists=true
          if [ "$PROFILE" = "release" ]; then
            if $exists; then
              gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" --prerelease=false --latest
            else
              gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" --generate-notes --latest
            fi
          elif $exists; then
            echo "Release $TAG already exists; not replacing its files with a debug build."
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG (debug build)" --generate-notes --prerelease
          fi
