name: build-installers

# Builds SENTIENT Setup (the GPUI installer + Platform Manager in app/) for
# Windows and Linux. Run
# manually (Actions -> build-installers -> Run workflow, pick debug/release) or
# on a version tag (debug by default — fast, for iteration; trigger a manual
# release build for a shippable installer). A release-candidate tag (v*-rc*)
# builds release and publishes a pre-release. On a version tag the installers
# and the Arch package are attached to a GitHub Release (see the release job).
# Also runs (debug) on a PR
# that edits this file, so a change to the installer build is proven before it
# merges.
#
# Nightly: every night at 02:00 IST, when master has commits the last
# nightly does not, a release build is published as the release tagged
# `nightly` (replaced each time; its title is the build's version,
# 0.8.0-nightly.YYYYMMDD), which the Platform Manager's Nightly update
# channel offers.
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile (debug = fast, release = optimized/shippable)"
        type: choice
        options: [debug, release]
        default: debug
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/build-installers.yml", "packaging/arch/**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nightly only: is there anything new since the last nightly? Every other
  # trigger builds.
  gate:
    name: what to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "version=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish 2>/dev/null || true)
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "Nothing new since the last nightly ($last)."; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${base}-nightly.$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  # The GPUI installer + Platform Manager (app/): one exe. The offline package
  # (PostgreSQL, TimescaleDB, SENTIENT payload) is assembled from it by
  # scripts/package-windows.ps1 where the payload files are.
  gpui-windows:
    name: GPUI setup (windows)
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Build
        working-directory: app
        shell: bash
        run: |
          # The version the program reports and compares updates against:
          # the tag it is built from (v0.8.0-rc6 -> 0.8.0-rc6).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export SPM_VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -n "${{ needs.gate.outputs.version }}" ]; then export SPM_VERSION="${{ needs.gate.outputs.version }}"; fi
          if [ "${{ github.event.inputs.profile }}" = "release" ] || [[ "$GITHUB_REF" == refs/tags/v*-rc* ]] || [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            cargo build --release; echo "PROFILE=release" >> "$GITHUB_ENV"
          else
            cargo build; echo "PROFILE=debug" >> "$GITHUB_ENV"
          fi
      - name: Test
        working-directory: app
        run: cargo test
      - name: Stage
        shell: pwsh
        run: |
          $v = (Select-String -Path app\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $exe = "app\target\$env:PROFILE\sentient-platform-manager.exe"
          if ((Get-Item $exe).VersionInfo.FileVersion -ne $v) { throw "FileVersion does not match Cargo.toml $v" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe "dist\SENTIENT-Setup-manager-$v.exe"
      # Authenticode, when the repository has a certificate: the secrets
      # SPM_SIGN_PFX_BASE64 (the .pfx, base64) and SPM_SIGN_PFX_PASSWORD.
      # Without them the build stays unsigned and says so.
      - name: Sign
        shell: pwsh
        env:
          SPM_SIGN_PFX_BASE64: ${{ secrets.SPM_SIGN_PFX_BASE64 }}
          SPM_SIGN_PFX_PASSWORD: ${{ secrets.SPM_SIGN_PFX_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -Path (Get-ChildItem dist\*.exe).FullName
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gpui-setup-windows
          if-no-files-found: error
          path: dist/*.exe

  # The same program on Linux: SENTIENT-Setup installs the Platform Manager
  # and SENTIENT (Docker or native systemd). Built on 22.04 so it starts on
  # older distributions too (glibc).
  gpui-linux:
    name: GPUI setup (linux)
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1
      - name: Build
        working-directory: app
        run: |
          # The version the program reports and compares updates against:
          # the tag it is built from (v0.8.0-rc6 -> 0.8.0-rc6).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export SPM_VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -n "${{ needs.gate.outputs.version }}" ]; then export SPM_VERSION="${{ needs.gate.outputs.version }}"; fi
          if [ "${{ github.event.inputs.profile }}" = "release" ] || [[ "$GITHUB_REF" == refs/tags/v*-rc* ]] || [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            cargo build --release; echo "PROFILE=release" >> "$GITHUB_ENV"
          else
            cargo build; echo "PROFILE=debug" >> "$GITHUB_ENV"
          fi
      - name: Test
        working-directory: app
        run: cargo test
      - name: Stage
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)
          mkdir -p dist
          cp "app/target/$PROFILE/sentient-platform-manager" "dist/SENTIENT-Setup-manager-$v-linux-$(uname -m)"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gpui-setup-linux
          if-no-files-found: error
          path: dist/*

  # The Platform Manager as a pacman package (packaging/arch), built on Arch
  # itself so it links against Arch's libraries. Always an optimized build.
  arch-package:
    name: Arch Linux package
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust clang cmake pkgconf \
            fontconfig freetype2 libxcb libxkbcommon libxkbcommon-x11 wayland vulkan-icd-loader alsa-lib
      - uses: actions/checkout@v4
      - name: Build
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          v=""; case "$GITHUB_REF" in refs/tags/v*) v="${GITHUB_REF_NAME#v}";; esac
          [ -n "${{ needs.gate.outputs.version }}" ] && v="${{ needs.gate.outputs.version }}"
          su builder -c "SPM_VERSION='$v' '$GITHUB_WORKSPACE/packaging/arch/build.sh' '$GITHUB_WORKSPACE/dist'"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          if-no-files-found: error
          path: dist/*.pkg.tar.zst

  # On a v* tag, attach the installers and the Arch package to a GitHub Release
  # for that tag so they stay downloadable (Actions artifacts expire after 90
  # days).
  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gpui-windows, gpui-linux, arch-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One publish per tag at a time, so a tag push and a manual run can't race.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A plain tag push (debug) publishes a pre-release and never replaces files
      # already there. Running this workflow by hand on the tag with
      # profile=release replaces them with optimized builds (same file names) and
      # makes it a full release, marked Latest.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PROFILE: ${{ github.event.inputs.profile }}
        run: |
          mapfile -t files < <(find dist -type f)
          printf 'Attaching %s\n' "${files[@]}"
          exists=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exists=true
          # A release candidate (v*-rc*) is built release and stays a pre-release.
          if [[ "$TAG" == v*-rc* ]]; then
            if $exists; then
              gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            else
              gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
                --title "$TAG (release candidate)" --generate-notes --prerelease
            fi
          elif [ "$PROFILE" = "release" ]; then
            if $exists; then
              gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" --prerelease=false --latest
            else
              gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" --generate-notes --latest
            fi
          elif $exists; then
            echo "Release $TAG already exists; not replacing its files with a debug build."
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG (debug build)" --generate-notes --prerelease
          fi

  # Nightly: replace the release tagged `nightly` with this build.
  nightly:
    name: publish nightly
    if: github.event_name == 'schedule' && needs.gate.outputs.build == 'true'
    needs: [gate, gpui-windows, gpui-linux, arch-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          mapfile -t files < <(find dist -type f)
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false --title "$VERSION" \
            --notes "Nightly build of master ${GITHUB_SHA:0:7} ($VERSION). For testing: the Platform Manager's Nightly update channel offers it."
