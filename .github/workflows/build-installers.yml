name: build-installers

# Builds SENTIENT Setup (the GPUI installer + Platform Manager in app/) for
# Windows and Linux. Run
# manually (Actions -> build-installers -> Run workflow, pick debug/release) or
# on a version tag (debug by default — fast, for iteration; trigger a manual
# release build for a shippable installer). A release-candidate tag (v*-rc*)
# builds release and publishes a pre-release. On a version tag the installers
# and the Linux packages (Arch, .deb, .rpm, AppImage, Flatpak) are attached
# to a GitHub Release (see the release job).
# Also runs on a PR from a release-candidate branch (head spm/rc*), and on
# any PR that edits this file or packaging/, so a change to the installer
# build is proven before it merges; the Windows setup is then a release build
# (a testable installer, the rc version from an spm/rcNN-... branch). The
# gate job below decides for a PR: every PR triggers the workflow, and the
# gate skips the build for the others.
#
# Nightly: every night at 02:00 IST, when master has commits the last
# nightly does not, a release build is published as the release tagged
# `nightly` (replaced each time; its title is the build's version,
# 0.8.0-nightly.YYYYMMDD), which the Platform Manager's Nightly update
# channel offers.
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile (debug = fast, release = optimized/shippable)"
        type: choice
        options: [debug, release]
        default: debug
  push:
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nightly only: is there anything new since the last nightly? Every other
  # trigger builds.
  gate:
    name: what to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          base=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)
          # A PR builds when it comes from an spm/rc* branch or changes the
          # installer build itself.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            build=false
            case "$HEAD_REF" in spm/rc*) build=true ;; esac
            if [ "$build" = false ] && gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only \
                 | grep -qE '^(\.github/workflows/build-installers\.yml|packaging/(arch|linux|flatpak|msix)/|scripts/package-msix\.ps1)'; then
              build=true
            fi
            echo "PR from $HEAD_REF: build=$build"
            echo "build=$build" >> "$GITHUB_OUTPUT"; echo "version=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "version=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish 2>/dev/null || true)
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "Nothing new since the last nightly ($last)."; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${base}-nightly.$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  # The GPUI installer + Platform Manager (app/): one exe. The offline package
  # (PostgreSQL, TimescaleDB, SENTIENT payload) is assembled from it by
  # scripts/package-windows.ps1 where the payload files are.
  #
  # The server agents first: the job code without the window (crate::remote
  # copies them to the servers a Platform Manager manages). Linux is static
  # (musl) so it runs on any distribution without desktop libraries; ARM64
  # is built natively on an arm runner. All three are carried inside every
  # build below (build.rs: the Windows setup, the Linux program and the
  # Arch package) and attached to the release, where an agent comes from
  # only for a build that lacks one.
  agents:
    name: server agents
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            file: sentient-platform-manager
            name: sentient-platform-manager-agent-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            file: sentient-platform-manager
            name: sentient-platform-manager-agent-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: sentient-platform-manager.exe
            name: sentient-platform-manager-agent-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        working-directory: app
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export SPM_VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -n "${{ needs.gate.outputs.version }}" ]; then export SPM_VERSION="${{ needs.gate.outputs.version }}"; fi
          # The same version and commit as the builds that carry it (the
          # gpui-windows job's rules for a pull request), so agent-info on
          # a server matches the program.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            export SPM_COMMIT="$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)"
            rc=$(echo '${{ github.head_ref }}' | sed -n 's|^spm/rc\([0-9][0-9]*\)-.*|\1|p')
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            if [ -n "$rc" ]; then export SPM_VERSION="$base-rc$rc"; fi
          fi
          cargo build --release --locked --no-default-features --target ${{ matrix.target }}
          mkdir -p ../agents
          cp "target/${{ matrix.target }}/release/${{ matrix.file }}" "../agents/${{ matrix.name }}"
      - if: runner.os == 'Linux'
        name: The Linux agent is static
        run: file agents/* | grep -q 'static' && ldd agents/* 2>&1 | grep -qE 'not a dynamic|statically linked'
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.target }}
          if-no-files-found: error
          path: agents/*

  gpui-windows:
    name: GPUI setup (windows)
    needs: [gate, agents]
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: agents
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Build
        working-directory: app
        shell: bash
        run: |
          # The server agents this build carries (build.rs).
          export SPM_LINUX_AGENT="$GITHUB_WORKSPACE/agents/sentient-platform-manager-agent-linux-x86_64"
          export SPM_LINUX_AARCH64_AGENT="$GITHUB_WORKSPACE/agents/sentient-platform-manager-agent-linux-aarch64"
          export SPM_WINDOWS_AGENT="$GITHUB_WORKSPACE/agents/sentient-platform-manager-agent-windows-x86_64.exe"
          for f in "$SPM_LINUX_AGENT" "$SPM_LINUX_AARCH64_AGENT" "$SPM_WINDOWS_AGENT"; do test -s "$f" || { echo "missing agent $f"; exit 1; }; done
          # The version the program reports and compares updates against:
          # the tag it is built from (v0.8.0-rc6 -> 0.8.0-rc6).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export SPM_VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -n "${{ needs.gate.outputs.version }}" ]; then export SPM_VERSION="${{ needs.gate.outputs.version }}"; fi
          # A pull request from a release-candidate branch (spm/rcNN-...)
          # builds a testable installer: release, reporting the rc version
          # and the branch's own commit (not the PR's merge commit).
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            export SPM_COMMIT="$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)"
            rc=$(echo '${{ github.head_ref }}' | sed -n 's|^spm/rc\([0-9][0-9]*\)-.*|\1|p')
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            if [ -n "$rc" ]; then export SPM_VERSION="$base-rc$rc"; fi
          fi
          if [ "${{ github.event.inputs.profile }}" = "release" ] || [[ "$GITHUB_REF" == refs/tags/v*-rc* ]] || [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            cargo build --release; echo "PROFILE=release" >> "$GITHUB_ENV"
          else
            cargo build; echo "PROFILE=debug" >> "$GITHUB_ENV"
          fi
      - name: Test
        working-directory: app
        run: cargo test
      - name: Stage
        shell: pwsh
        run: |
          $v = (Select-String -Path app\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $exe = "app\target\$env:PROFILE\sentient-platform-manager.exe"
          if ((Get-Item $exe).VersionInfo.FileVersion -ne $v) { throw "FileVersion does not match Cargo.toml $v" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe "dist\SENTIENT-Setup-manager-$v.exe"
      # Authenticode, when the repository has a certificate: the secrets
      # SPM_SIGN_PFX_BASE64 (the .pfx, base64) and SPM_SIGN_PFX_PASSWORD.
      # Without them the build stays unsigned and says so.
      - name: Sign
        shell: pwsh
        env:
          SPM_SIGN_PFX_BASE64: ${{ secrets.SPM_SIGN_PFX_BASE64 }}
          SPM_SIGN_PFX_PASSWORD: ${{ secrets.SPM_SIGN_PFX_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -Path (Get-ChildItem dist\*.exe).FullName
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gpui-setup-windows
          if-no-files-found: error
          path: dist/*.exe

  # The Microsoft Store package (MSIX) of the same program
  # (scripts/package-msix.ps1, docs/MICROSOFT_STORE.md): always a release
  # build. The package identity is the app's Partner Center identity
  # (INVENIASYSTEMS.SENTIENTPlatformManager, built into the packaging
  # script); the repository variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER and
  # MSIX_PUBLISHER_DISPLAY_NAME override it. The sideload package next to it
  # has a test identity (never submitted). The Store takes final
  # versions only: a release-candidate or nightly build is packaged with the
  # version in app/Cargo.toml (its program still reports its own), for
  # testing. Not attached to GitHub releases: the .msixupload goes to
  # Partner Center by hand.
  msix-store:
    name: MSIX (Store)
    needs: [gate, agents]
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: agents
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Build
        working-directory: app
        shell: bash
        run: |
          export SPM_LINUX_AGENT="$GITHUB_WORKSPACE/agents/sentient-platform-manager-agent-linux-x86_64"
          export SPM_LINUX_AARCH64_AGENT="$GITHUB_WORKSPACE/agents/sentient-platform-manager-agent-linux-aarch64"
          export SPM_WINDOWS_AGENT="$GITHUB_WORKSPACE/agents/sentient-platform-manager-agent-windows-x86_64.exe"
          for f in "$SPM_LINUX_AGENT" "$SPM_LINUX_AARCH64_AGENT" "$SPM_WINDOWS_AGENT"; do test -s "$f" || { echo "missing agent $f"; exit 1; }; done
          # The same version rules as gpui-windows.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export SPM_VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -n "${{ needs.gate.outputs.version }}" ]; then export SPM_VERSION="${{ needs.gate.outputs.version }}"; fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            export SPM_COMMIT="$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)"
            rc=$(echo '${{ github.head_ref }}' | sed -n 's|^spm/rc\([0-9][0-9]*\)-.*|\1|p')
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            if [ -n "$rc" ]; then export SPM_VERSION="$base-rc$rc"; fi
          fi
          cargo build --release
      # The program inside the package is Authenticode-signed like the
      # download when the repository has the certificate (the package
      # itself is signed by the Microsoft Store).
      - name: Sign the program
        shell: pwsh
        env:
          SPM_SIGN_PFX_BASE64: ${{ secrets.SPM_SIGN_PFX_BASE64 }}
          SPM_SIGN_PFX_PASSWORD: ${{ secrets.SPM_SIGN_PFX_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -Path app\target\release\sentient-platform-manager.exe -Description "SENTIENT Platform Manager"
      - name: Package
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          # The final version a v<version> tag names; otherwise (rc, nightly,
          # a manual or PR build) the one in app/Cargo.toml.
          $v = (Select-String -Path app\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)$') { $v = $Matches[1] }
          # For Partner Center: unsigned, with the repository's identity.
          ./scripts/package-msix.ps1 -Exe app\target\release\sentient-platform-manager.exe -Version $v -OutDir dist\store
      # For a sideload test: the test identity (Publisher = INVENIA's
      # code-signing certificate), signed with that certificate when the
      # repository has it (docs/MICROSOFT_STORE.md, Sideload test).
      - name: Package for sideloading
        shell: pwsh
        env:
          SPM_SIGN_PFX_BASE64: ${{ secrets.SPM_SIGN_PFX_BASE64 }}
          MSIX_SIGN_PFX_PASSWORD: ${{ secrets.SPM_SIGN_PFX_PASSWORD }}
        run: |
          $v = (Select-String -Path app\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)$') { $v = $Matches[1] }
          $sign = @{}
          if ($env:SPM_SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "msix-sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SPM_SIGN_PFX_BASE64))
            $sign = @{ SignWith = $pfx }
          } else {
            Write-Host "::warning::No signing certificate in this repository: the sideload package is unsigned (sign it before Add-AppxPackage)."
          }
          try {
            ./scripts/package-msix.ps1 -Exe app\target\release\sentient-platform-manager.exe -Version $v -OutDir dist\sideload -TestIdentity @sign
          } finally {
            if ($sign.SignWith) { Remove-Item -Force $sign.SignWith -ErrorAction SilentlyContinue }
          }
          Remove-Item -Force dist\sideload\*.msixupload
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: msix-store
          if-no-files-found: error
          path: |
            dist/store/*.msix
            dist/store/*.msixupload
            dist/sideload/*.msix

  # The same program on Linux: SENTIENT-Setup installs the Platform Manager
  # and SENTIENT (Docker or native systemd). Built on 22.04 so it starts on
  # older distributions too (glibc).
  gpui-linux:
    name: GPUI setup (linux)
    needs: [gate, agents]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-22.04
    # The version the program reports, for the packages made from it.
    outputs:
      version: ${{ steps.build.outputs.version }}
      profile: ${{ steps.build.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: agents
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1
      - name: Build
        id: build
        working-directory: app
        run: |
          # The server agents this build carries (build.rs).
          export SPM_LINUX_AGENT="$GITHUB_WORKSPACE/agents/sentient-platform-manager-agent-linux-x86_64"
          export SPM_LINUX_AARCH64_AGENT="$GITHUB_WORKSPACE/agents/sentient-platform-manager-agent-linux-aarch64"
          export SPM_WINDOWS_AGENT="$GITHUB_WORKSPACE/agents/sentient-platform-manager-agent-windows-x86_64.exe"
          for f in "$SPM_LINUX_AGENT" "$SPM_LINUX_AARCH64_AGENT" "$SPM_WINDOWS_AGENT"; do test -s "$f" || { echo "missing agent $f"; exit 1; }; done
          # The version the program reports and compares updates against:
          # the tag it is built from (v0.8.0-rc6 -> 0.8.0-rc6).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export SPM_VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -n "${{ needs.gate.outputs.version }}" ]; then export SPM_VERSION="${{ needs.gate.outputs.version }}"; fi
          if [ "${{ github.event.inputs.profile }}" = "release" ] || [[ "$GITHUB_REF" == refs/tags/v*-rc* ]] || [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            cargo build --release; echo "PROFILE=release" >> "$GITHUB_ENV"; echo "profile=release" >> "$GITHUB_OUTPUT"
          else
            cargo build; echo "PROFILE=debug" >> "$GITHUB_ENV"; echo "profile=debug" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${SPM_VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)}" >> "$GITHUB_OUTPUT"
      - name: Test
        working-directory: app
        run: cargo test
      - name: Stage
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)
          mkdir -p dist
          cp "app/target/$PROFILE/sentient-platform-manager" "dist/SENTIENT-Setup-manager-$v-linux-$(uname -m)"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gpui-setup-linux
          if-no-files-found: error
          path: dist/*

  # The Platform Manager as a pacman package (packaging/arch), built on Arch
  # itself so it links against Arch's libraries. Always an optimized build.
  arch-package:
    name: Arch Linux package
    needs: [gate, agents]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust rust-musl musl clang cmake pkgconf \
            fontconfig freetype2 libxcb libxkbcommon libxkbcommon-x11 wayland vulkan-icd-loader alsa-lib
      - uses: actions/checkout@v4
      # Every server agent, carried inside the package (the PKGBUILD takes
      # them from SPM_PREBUILT_AGENTS).
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: agents
          merge-multiple: true
      - name: Build
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          v=""; rel=1; commit=""
          case "$GITHUB_REF" in refs/tags/v*) v="${GITHUB_REF_NAME#v}";; esac
          [ -n "${{ needs.gate.outputs.version }}" ] && v="${{ needs.gate.outputs.version }}"
          # A pull request from spm/rcNN-MM…: the same version and release as
          # packaging/arch/build-cached.sh (0.8.0rcNN-MM), and the branch's
          # own commit, so the two builds agree and pacman orders them.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            head='${{ github.head_ref }}'
            rc=$(echo "$head" | sed -n 's|^spm/rc\([0-9][0-9]*\)-.*|\1|p')
            round=$(echo "$head" | sed -n 's|^spm/rc[0-9][0-9]*-\([0-9][0-9]*\).*|\1|p')
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)
            [ -n "$rc" ] && v="$base-rc$rc"
            [ -n "$round" ] && rel="$round"
            commit=$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)
          fi
          su builder -c "SPM_VERSION='$v' SPM_PKGREL='$rel' SPM_COMMIT='$commit' SPM_PREBUILT_AGENTS='$GITHUB_WORKSPACE/agents' '$GITHUB_WORKSPACE/packaging/arch/build.sh' '$GITHUB_WORKSPACE/dist'"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          if-no-files-found: error
          path: dist/*.pkg.tar.zst

  # The same binary as gpui-linux (not built again) as a .deb, an .rpm and
  # an AppImage (packaging/linux/build-packages.sh). Built on 22.04, the
  # oldest Ubuntu supported, so dpkg-shlibdeps asks for the oldest library
  # versions that work. The packages are as optimized as that binary: a
  # plain tag push builds debug, a release run (profile=release, rc tags,
  # nightly) release.
  linux-packages:
    name: Linux packages (deb, rpm, AppImage)
    needs: [gate, gpui-linux]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-22.04
    env:
      NFPM_VERSION: 2.41.3
      NFPM_SHA256: 22aa6d3bc2ec239d62d3d190bcb036a47f2b24e0c3c6edfccebb6a55fbb2078e
      APPIMAGETOOL_VERSION: "1.9.0"
      APPIMAGETOOL_SHA256: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gpui-setup-linux
          path: input
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils file desktop-file-utils
          # The libraries the binary links: dpkg-shlibdeps maps each to its
          # package and fails on one that is not installed here.
          sudo apt-get install -y libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libvulkan1 libasound2 libxcb1 libx11-xcb1
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o "$RUNNER_TEMP/nfpm.tar.gz" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP/tools" nfpm
          curl -fsSL -o "$RUNNER_TEMP/tools/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/tools/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/tools/"*
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Build
        env:
          VERSION: ${{ needs.gpui-linux.outputs.version }}
        run: |
          test -n "$VERSION" || { echo "gpui-linux reported no version"; exit 1; }
          bins=(input/SENTIENT-Setup-manager-*-linux-x86_64)
          if [ ${#bins[@]} -ne 1 ] || [ ! -s "${bins[0]}" ]; then echo "expected one Linux binary in input/, found: ${bins[*]}"; exit 1; fi
          echo "Packaging ${bins[0]} as $VERSION (${{ needs.gpui-linux.outputs.profile }} build)"
          packaging/linux/build-packages.sh "${bins[0]}" "$VERSION" dist deb rpm appimage
          for p in 'dist/*.deb' 'dist/*.rpm' 'dist/*.AppImage'; do
            compgen -G "$p" >/dev/null || { echo "missing $p"; exit 1; }
          done
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - name: Check the AppImage
        env:
          VERSION: ${{ needs.gpui-linux.outputs.version }}
        run: |
          # The libraries the binary needs (the AppImage carries none).
          sudo apt-get install -y libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libvulkan1 libasound2 libxcb1
          app=$(ls dist/*.AppImage)
          info=$("$app" --appimage-extract-and-run --job agent-info)
          echo "$info"
          echo "$info" | python3 -c 'import json,sys,os; d=json.load(sys.stdin); assert d["version"]==os.environ["VERSION"], d; assert d["window"], d'
          "$app" --appimage-extract-and-run --job agents | tee "$RUNNER_TEMP/agents.txt"
          awk -F'\t' 'NF!=3 || $2<1 {bad=1} END {exit bad || NR!=3}' "$RUNNER_TEMP/agents.txt" || { echo "the AppImage does not carry every server agent"; exit 1; }
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  # Install each package on a clean system of the kind it is for and start
  # the program headless: the dependencies resolve, the files are where the
  # Platform Manager expects them (/opt/sentient-platform-manager), and it
  # reports this version and carries every server agent.
  linux-packages-check:
    name: install check (${{ matrix.image }})
    needs: [gpui-linux, linux-packages]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", kind: deb }
          - { image: "ubuntu:24.04", kind: deb }
          - { image: "debian:12", kind: deb }
          - { image: "fedora:41", kind: rpm }
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkgs
      - name: Install
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu
          case "${{ matrix.kind }}" in
            deb)
              apt-get update
              # Depends only: the package must work without its Recommends.
              apt-get install -y --no-install-recommends ./pkgs/*.deb
              dpkg -s sentient-platform-manager ;;
            rpm)
              dnf install -y --setopt=install_weak_deps=False ./pkgs/*.rpm
              rpm -qi sentient-platform-manager ;;
          esac
      - name: Start it headless
        env:
          VERSION: ${{ needs.gpui-linux.outputs.version }}
        run: |
          set -eu
          exe=/opt/sentient-platform-manager/sentient-platform-manager
          for f in "$exe" /usr/bin/sentient-platform-manager \
                   /usr/share/applications/sentient-platform-manager.desktop \
                   /usr/share/icons/hicolor/256x256/apps/sentient-platform-manager.png \
                   /usr/share/icons/hicolor/scalable/apps/sentient-platform-manager.svg \
                   /usr/share/licenses/sentient-platform-manager/LICENSE; do
            test -e "$f" || { echo "missing $f"; exit 1; }
          done
          test -x "$exe"
          if command -v ldd >/dev/null; then
            if ldd "$exe" | grep 'not found'; then echo "unresolved libraries"; exit 1; fi
          fi
          info=$(sentient-platform-manager --job agent-info)
          echo "$info"
          case "$info" in *"\"version\":\"$VERSION\""*'"window":true'*) ;; *) echo "expected version $VERSION with its window"; exit 1 ;; esac
          sentient-platform-manager --job agents | tee agents.txt
          awk -F'\t' 'NF!=3 || $2<1 {bad=1} END {exit bad || NR!=3}' agents.txt || { echo "the package does not carry every server agent"; exit 1; }

  # The same binary as a Flatpak bundle (packaging/flatpak), built and
  # installed in Flathub's builder image, then started inside its sandbox.
  # The bundle's permissions are the manifest's finish-args.
  flatpak:
    name: Flatpak bundle
    needs: [gate, gpui-linux]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gpui-setup-linux
          path: input
      - name: Build
        env:
          VERSION: ${{ needs.gpui-linux.outputs.version }}
          FLATPAK_WORK: ${{ runner.temp }}/flatpak
        run: |
          set -eu
          test -n "$VERSION" || { echo "gpui-linux reported no version"; exit 1; }
          bins=$(ls input/SENTIENT-Setup-manager-*-linux-x86_64)
          if [ "$(echo "$bins" | wc -l)" -ne 1 ] || [ ! -s "$bins" ]; then echo "expected one Linux binary in input/, found: $bins"; exit 1; fi
          packaging/flatpak/build.sh "$bins" "$VERSION" dist
      - name: Install and start it headless
        env:
          VERSION: ${{ needs.gpui-linux.outputs.version }}
        run: |
          set -eu
          id=in.invenia.SentientPlatformManager
          flatpak install -y --noninteractive --bundle dist/*.flatpak
          flatpak info --show-permissions "$id"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"; mkdir -p -m 0700 "$XDG_RUNTIME_DIR"
          run() {
            if command -v dbus-run-session >/dev/null; then
              dbus-run-session -- flatpak run --command="$1" "$id" "${@:2}"
            else
              flatpak run --command="$1" "$id" "${@:2}"
            fi
          }
          info=$(run sentient-platform-manager --job agent-info)
          echo "$info"
          case "$info" in *"\"version\":\"$VERSION\""*'"window":true'*) ;; *) echo "expected version $VERSION with its window"; exit 1 ;; esac
          run sentient-platform-manager --job agents | tee agents.txt
          awk -F'\t' 'NF!=3 || $2<1 {bad=1} END {exit bad || NR!=3}' agents.txt || { echo "the Flatpak does not carry every server agent"; exit 1; }
          # ssh comes with the bundle (its askpass helper is this program).
          run ssh -V
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-package
          if-no-files-found: error
          path: dist/*.flatpak

  # On a v* tag, attach the installers and the Linux packages to a GitHub Release
  # for that tag so they stay downloadable (Actions artifacts expire after 90
  # days).
  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [agents, gpui-windows, gpui-linux, arch-package, linux-packages, linux-packages-check, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One publish per tag at a time, so a tag push and a manual run can't race.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            scripts/release-notes.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A plain tag push (debug) publishes a pre-release and never replaces files
      # already there. Running this workflow by hand on the tag with
      # profile=release replaces them with optimized builds (same file names) and
      # makes it a full release, marked Latest.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PROFILE: ${{ github.event.inputs.profile }}
        run: |
          mapfile -t files < <(find dist -type f)
          printf 'Attaching %s\n' "${files[@]}"
          # The notes: this version's CHANGELOG.md section, else GitHub's list.
          notes=(--generate-notes)
          if python3 scripts/release-notes.py check CHANGELOG.md "${TAG#v}"; then
            python3 scripts/release-notes.py body CHANGELOG.md "${TAG#v}" --product spm > "$RUNNER_TEMP/notes.md"
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          fi
          exists=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exists=true
          # A release candidate (v*-rc*) is built release and stays a pre-release.
          if [[ "$TAG" == v*-rc* ]]; then
            if $exists; then
              gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            else
              gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
                --title "$TAG (release candidate)" "${notes[@]}" --prerelease
            fi
          elif [ "$PROFILE" = "release" ]; then
            if $exists; then
              gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" --prerelease=false --latest
            else
              gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" "${notes[@]}" --latest
            fi
          elif $exists; then
            echo "Release $TAG already exists; not replacing its files with a debug build."
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG (debug build)" "${notes[@]}" --prerelease
          fi

  # Nightly: replace the release tagged `nightly` with this build.
  nightly:
    name: publish nightly
    if: github.event_name == 'schedule' && needs.gate.outputs.build == 'true'
    needs: [gate, gpui-windows, gpui-linux, arch-package, linux-packages, linux-packages-check, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          mapfile -t files < <(find dist -type f)
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false --title "$VERSION" \
            --notes "Nightly build of master ${GITHUB_SHA:0:7} ($VERSION). For testing: the Platform Manager's Nightly update channel offers it."
